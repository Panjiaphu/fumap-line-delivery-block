{% extends "mobile/layout.html" %}

{% block title %}忘記密碼｜{{ APP_NAME }}{% endblock %}
{% block subtitle %}透過 Email 重設密碼{% endblock %}

{% block content %}
<section class="card">
  <h2>忘記密碼</h2>
  <p class="muted">
    請輸入註冊時使用的 Email。若帳號存在，系統會寄出重設密碼連結。
  </p>

  <form method="post" action="/forgot-password">
    <div class="form-group">
      <label>Email</label>
      <input
        name="email"
        type="email"
        required
        autocomplete="email"
        placeholder="example@gmail.com"
      >
    </div>

    <button class="btn" type="submit">寄出重設連結</button>
  </form>
</section>

<section class="card">
  <a class="btn secondary" href="/login">返回登入</a>
</section>
{% endblock %}

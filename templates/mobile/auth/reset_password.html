{% extends "mobile/layout.html" %}

{% block title %}重設密碼｜{{ APP_NAME }}{% endblock %}
{% block subtitle %}設定新的登入密碼{% endblock %}

{% block content %}
<section class="card">
  <h2>重設密碼</h2>
  <p class="muted">
    請輸入新的密碼。更新後，請使用新密碼重新登入。
  </p>

  <form method="post" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">

    <div class="form-group">
      <label>新密碼</label>
      <input
        name="password"
        type="password"
        required
        autocomplete="new-password"
        placeholder="至少 6 位"
      >
    </div>

    <div class="form-group">
      <label>確認新密碼</label>
      <input
        name="confirm_password"
        type="password"
        required
        autocomplete="new-password"
        placeholder="請再次輸入新密碼"
      >
    </div>

    <button class="btn" type="submit">更新密碼</button>
  </form>
</section>

<section class="card">
  <a class="btn secondary" href="/login">返回登入</a>
</section>
{% endblock %}
